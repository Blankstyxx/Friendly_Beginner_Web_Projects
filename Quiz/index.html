<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Quiz</title>
  </head>
  <body>
    <main class="quiz-container">
      <h1>Quiz</h1>

      <div class="quiz-card">
        <!-- Questions -->
        <p class="question"></p>

        <!-- option button -->
        <div class="options">
          <button class="option">Option 1</button>
          <button class="option">Option 2</button>
          <button class="option">Option 3</button>
          <button class="option">Option 4</button>
        </div>

        <!-- Message -->
        <p class="message"></p>

        <button class="next-btn">Next Question</button>

        <p class="score">Score: <span class="score-value">0</span></p>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
